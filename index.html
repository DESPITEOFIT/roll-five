
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <meta
      name="description"
      content="Play Yahtzee with friends on one device."
    />

    <title>Yahtzee Local</title>

    <link rel="stylesheet" href="style.css" />

    <script src="game.js" defer></script>
    <script src="stats.js" defer></script>
    <script src="stats-plus.js" defer></script>
    <script src="app-v1.6.js" defer></script>
  </head>

  <body>
    <main class="app">
      <!-- ================================================
           HEADER
           ================================================ -->

      <header class="app-header">
        <div class="brand-block">
          <h1>🎲 Yahtzee Local</h1>
          <p>Pass-and-play • One device</p>
        </div>

        <nav
          class="header-actions"
          aria-label="Game navigation"
        >
          <button
            id="new-game"
            class="secondary"
            type="button"
          >
            New game
          </button>

          <!-- Other navigation buttons are added
               by the JavaScript modules. -->
        </nav>
      </header>

      <!-- ================================================
           SETUP SCREEN
           ================================================ -->

      <section
        id="setup"
        class="setup"
        aria-labelledby="setup-title"
      >
        <div class="setup-intro">
          <p class="setup-eyebrow">NEW MATCH</p>

          <h2 id="setup-title">Who's playing?</h2>

          <p class="setup-description">
            Choose your players and get ready to roll.
          </p>
        </div>

        <div class="setup-config">
          <label for="player-count">
            Number of players
          </label>

          <select id="player-count">
            <option value="2">2 players</option>
            <option value="3">3 players</option>
          </select>
        </div>

        <!-- Player cards are generated by game.js.
             Profile selectors are added by stats.js. -->
        <div id="name-fields"></div>

        <div class="setup-footer">
          <p>
            🎲 Each player gets up to three rolls per turn.
          </p>

          <button id="start" type="button">
            🎲 Start Match
          </button>
        </div>
      </section>

      <!-- ================================================
           MAIN GAME
           ================================================ -->

      <section
        id="game"
        aria-label="Yahtzee game"
        hidden
      >
        <div class="turnbar">
          <h2 id="turn-label"></h2>
          <span id="roll-label"></span>
        </div>

        <div
          id="dice"
          class="dice"
          role="group"
          aria-label="Five dice"
        ></div>

        <p
          id="hint"
          class="hint"
          aria-live="polite"
        ></p>

        <!-- Roll, Undo and Rematch belong here. -->
        <div class="actions">
          <button id="roll" type="button">
            Roll dice
          </button>
        </div>

        <div class="score-scroll">
          <table id="score-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>

        <p id="status" role="status"></p>
      </section>
    </main>
    <footer id="site-footer">
      <p>
        Developed By <strong>Devarsh Muthe</strong>
      </p>

      <small>© 2026 Yahtzee Local</small>
    </footer>
  </body>
</html>
